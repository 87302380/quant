name: BTC cloud tests and backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Restore data, run tests, and replay bear research
        run: python cloud_verify.py --backtest
      - name: Save execution record and research results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: btc-research-${{ github.run_number }}
          path: |
            results/cloud_execution.json
            results/btc_bear/
          retention-days: 14
          if-no-files-found: warn
